# PRD section 10 requires these checks to pass before a deploy: tenant
# isolation, durability under crash, policy enforcement and cycle detection.
# They are the reason the suite exists, so CI runs the whole of it rather than
# a subset.
name: CI

on:
  push:
    # Not the merge queue's own branches: those are tested as merge_group
    # below, and as pushes too every candidate would run twice.
    branches: ['**', '!gh-readonly-queue/**']
  pull_request:
  # A merge queue tests each pull request on top of what main is about to
  # become, with the ones ahead of it, before it lands: two pull requests that
  # were each green against an older main can still break it together, and
  # that has happened to other projects (Buzz #8036). Enabled in the
  # repository's settings (docs/RELEASING.md); this is the half CI owns.
  merge_group:
  # The release workflow runs the whole of this before it builds anything
  # from a tag (.github/workflows/release.yml).
  workflow_call:
  # F5.11's acceptance criterion is a thousand claim races, which takes about
  # seventy seconds. Run nightly rather than on every push: the property is
  # structural, so a broken one fails in the first few rounds, and the stated
  # number still executes on a schedule instead of being argued away.
  #
  # GitHub fires `schedule` on the default branch only, so on a feature branch
  # the soak is reached through `workflow_dispatch` (Actions -> CI -> Run
  # workflow) or locally with PALUGADA_SOAK=1. Said here because a nightly that
  # silently does not run on the branch you are working on is worse than none.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Every action is pinned to a commit, with its tag beside it: a tag can be
# moved to other code by whoever controls the action's repository, and a job
# here holds the repository's token. Dependabot (.github/dependabot.yml)
# proposes the next commit, and its tag, as a pull request.
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Carries pgvector, which the stock postgres image does not.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        # -U postgres because the health check runs as root inside the
        # container and pg_isready defaults the role to the OS user: without it
        # every probe logs `FATAL: role "root" does not exist`. The probe still
        # passes, which is what makes it worth fixing -- it fills the server log
        # with failures nobody caused, and that log is what the suite is audited
        # against after a green run. Real failures have to stand out in it.
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PALUGADA_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/postgres
      PALUGADA_APP_URL: postgres://palugada_app:dev_app@localhost:5432/palugada
      PALUGADA_ADMIN_URL: postgres://palugada_admin:dev_admin@localhost:5432/palugada
      PALUGADA_OWNER_URL: postgres://palugada_owner:dev_owner@localhost:5432/palugada

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # The owner's console is a React and Mantine page built by Vite, and the
      # acceptance suite serves the build: the deployment test fetches the page
      # and its assets, and the route guard reads the source. Its own type
      # check runs as part of the build.
      - name: Install the console
        run: npm run console:install

      - name: Build the console
        run: npm run console:build

      - name: Provision database
        run: npm run db:setup

      - name: Apply migrations
        run: npm run db:migrate

      # The whole suite, once, with V8 coverage. The report is the job's
      # summary: functions and branches, the files with the most functions
      # never called, and a failure if a file under src/ is not loaded by
      # any test at all (scripts/coverage-report.ts).
      - name: Acceptance tests, with coverage
        run: npm run test:coverage

      # The soak, at the scale F5.11 states: a thousand claim races instead of
      # sixty. Only on the nightly run and on a manual dispatch, so a push
      # waits ninety seconds rather than three minutes. One file rather than
      # the whole suite, because that file is the only one PALUGADA_SOAK
      # changes and the rest has already run in the step above.
      - name: Claim race at the stated scale (F5.11)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PALUGADA_SOAK: '1'
        run: node --test --test-concurrency=1 test/acceptance/checkout-lease-lane.test.ts

  # Known vulnerabilities in what ships: the platform's production
  # dependencies, and the console's, whose build is what the browser runs.
  # High and critical fail the run; a moderate one is printed and left to
  # Dependabot's weekly update. A job of its own, so an advisory published
  # overnight does not also hide what the tests say.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Audit the platform's production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

      - name: Audit the console's production dependencies
        working-directory: console
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

  # The image as an operator runs it: built from the Dockerfile, started by
  # docker-compose.yml beside a database on a fresh volume, healthy, able to
  # do one piece of work (scripts/smoke.ts), with an init that reaps what an
  # agent CLI leaves behind, and stopped by SIGTERM with exit 0. The suite
  # above runs the code; only this runs the container, and a Dockerfile or
  # compose change that breaks either used to reach nobody until a deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What `npm run setup` writes when "With Docker Compose" is chosen:
      # a password for each database role, and the owner's TOTP secret.
      - name: Write the .env compose reads
        run: |
          for role in SUPERUSER OWNER APP ADMIN; do
            echo "PALUGADA_DB_${role}_PASSWORD=$(openssl rand -hex 18)"
          done > .env
          echo "PALUGADA_SECRET_OWNER_TOTP=$(openssl rand 20 | base32 | tr -d '=')" >> .env
          echo "PALUGADA_OWNER_TOTP_REF=env://PALUGADA_SECRET_OWNER_TOTP" >> .env

      - name: Build and start, and wait for both to be healthy
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Health
        run: curl -fsS http://127.0.0.1:8787/api/health

      # The smoke run queues a task and runs a worker of its own, so nothing
      # else may serve the database meanwhile: the app's worker has no runtime
      # here (no model is configured), and when it claimed the smoke's task
      # first it halted it as runtime_unavailable -- run 176 failed that way,
      # and the runs either side passed only because the smoke's worker won.
      # So the app is stopped, the check runs in a container of the same
      # image, and the app is started again for the steps below.
      - name: One piece of work, in a container of the image, with the app stopped
        run: |
          docker compose stop app
          docker compose run --rm --no-deps app node scripts/smoke.ts
          docker compose up -d --wait --wait-timeout 120 app

      # The companies' browser starts in the image with its sandbox, under
      # the profile the compose file gives it: a page renders in a process
      # in a user namespace of its own (scripts/browser-check.ts).
      - name: The browser runs sandboxed in the image
        run: docker compose exec -T app node scripts/browser-check.ts

      # A process whose parent exits is handed to PID 1; tini reaps it.
      - name: An orphan is reaped, not left a zombie
        run: |
          docker compose exec -T app sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q '^/usr/bin/tini '
          docker compose exec -T app sh -c '(sleep 0.3 &) ; exit 0'
          sleep 2
          zombies=$(docker compose exec -T app sh -c 'grep -l "^[0-9]* ([^)]*) Z" /proc/[0-9]*/stat 2>/dev/null | wc -l')
          echo "zombies: $zombies"
          test "$zombies" -eq 0

      - name: SIGTERM stops it cleanly
        run: |
          docker compose stop app
          test "$(docker inspect "$(docker compose ps -aq app)" --format '{{.State.ExitCode}}')" = 0
          docker compose logs app | grep -q 'SIGTERM, stopping'

      # F12.9 on a real daemon: one run on the `docker` backend, whose runtime
      # tries what a compromised one would, and reports what it could do.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: A run on the docker backend is contained
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm run container:check

      # The tools research's sixth recommendation on a real daemon: a role's
      # Python, built into deploy/compute, sums a spreadsheet with no network,
      # as nobody, on a read-only image, and is stopped at its time.
      - name: A role's Python runs where it reaches nothing
        run: npm run compute:check

      - name: What the containers said
        if: failure()
        run: docker compose logs
