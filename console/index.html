<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALUGADA</title>
<link rel="stylesheet" href="/console.css">
</head>
<body>
<!--
  The owner's console (PRD v2 §5 principle 1, F10).

  One page, one script, no build step and no framework. That is not
  minimalism for its own sake: this page is the surface where a person
  approves things that cannot be undone, and a dependency tree is a set of
  things that can change what the button under their finger does. Everything
  here is readable in one sitting, which is the property that matters.

  The page holds no rules. Which items exist, what may be pressed, whether a
  tier 3 approval needs a second factor -- all of it is answered by the API,
  which asks `decide`, which is where every surface meets the same gate. A
  console that decided any of that for itself would be a second implementation
  to get wrong.
-->
<header>
  <h1>PALUGADA</h1>
  <div id="who" hidden>
    <span id="device"></span>
    <button id="sign-out" class="link">Sign out</button>
  </div>
</header>

<main>
  <!-- Signing in is presenting a second factor. There are no accounts. -->
  <section id="sign-in">
    <h2>Sign in</h2>
    <p class="muted">Enter the code from your authenticator.</p>
    <form id="sign-in-form">
      <input id="code" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
      <button type="submit">Sign in</button>
    </form>
    <p id="sign-in-error" class="error" hidden></p>
  </section>

  <section id="console" hidden>
    <!-- F10.7. The global controls, where they can be reached in one press. -->
    <div id="controls">
      <button id="stop-all" class="danger"></button>
      <span id="control-note" class="muted"></span>
    </div>

    <nav id="companies"></nav>

    <div id="digest" class="digest"></div>

    <!-- F10.1. One queue, and F10.2 puts everything a judgement needs on the
         card: what, why, tier, cost, and what happens if it is refused. -->
    <ul id="inbox"></ul>
    <p id="empty" class="muted" hidden>Nothing is waiting.</p>
  </section>
</main>

<!-- F10.10. A tier 3 approval asks for the factor again, here, at the moment
     of the decision -- not once at sign-in and then trusted all day. -->
<dialog id="factor">
  <form method="dialog" id="factor-form">
    <h2>Confirm with your authenticator</h2>
    <p id="factor-what" class="muted"></p>
    <input id="factor-code" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
    <p id="factor-error" class="error" hidden></p>
    <menu>
      <button value="cancel" type="button" id="factor-cancel" class="link">Cancel</button>
      <button value="confirm" type="submit">Confirm</button>
    </menu>
  </form>
</dialog>

<!-- F11.2: the trace behind an item, one hop from the item. -->
<dialog id="trace">
  <h2>What happened</h2>
  <pre id="trace-body"></pre>
  <menu><button type="button" id="trace-close">Close</button></menu>
</dialog>

<script src="/console.js"></script>
</body>
</html>
